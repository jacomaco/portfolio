<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Jacob Knuts Johansson – livboj">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="buoy" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6eaff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6"/>
      <feOffset dx="0" dy="1.6" result="offsetblur"/>
      <feFlood flood-color="#1a1a2e" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#tile)"/>

  <g filter="url(#shadow)">
    <circle cx="32" cy="32" r="17.5" fill="none" stroke="url(#buoy)" stroke-width="10"/>
    <circle cx="32" cy="32" r="17.5" fill="none" stroke="#ff6b6b" stroke-width="10"
            stroke-dasharray="12.6 14.8889" transform="rotate(-20.626 32 32)"/>
    <circle cx="32" cy="32" r="22.5" fill="none" stroke="#1a1a2e" stroke-opacity="0.14" stroke-width="0.9"/>
    <circle cx="32" cy="32" r="12.5" fill="none" stroke="#1a1a2e" stroke-opacity="0.16" stroke-width="1"/>
  </g>
</svg>
